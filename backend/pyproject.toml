[project]
name = "drdoc-backend"
version = "0.1.0"
description = "Dr.Doc knowledge assistant API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
