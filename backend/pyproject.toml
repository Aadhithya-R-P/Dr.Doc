[project]
name = "drdoc-backend"
version = "0.1.0"
description = "Dr.Doc knowledge assistant API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi[standard]>=0.115,<1",
    "google-genai>=2.31.0",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "pypdf>=6.21.1,<7",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a real PostgreSQL database with pgvector"]
